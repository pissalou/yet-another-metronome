<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metronome (Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;800&family=Work+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --panel:#CBD5C3; --panel-2:#BCC8B3; --ink:#1F2E27; --ink-soft:#4A5B52;
  --brass:#9C7A44; --brass-dark:#6F5630; --glass:#E4EBDE; --glass-edge:#8E9C90;
  --socket:#7E8A80; --track:#A6B39D; --amber:#FFB23F; --red:#E5483B;
  --btn-ink:#F4F7F1;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel:#1D2924; --panel-2:#24322C; --ink:#DCE6D6; --ink-soft:#97A79C;
    --brass:#C9A46A; --brass-dark:#8C6E3E; --glass:#2E3D36; --glass-edge:#5D6D63;
    --socket:#56645B; --track:#3A4A42; --btn-ink:#1D2924;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --panel:#1D2924; --panel-2:#24322C; --ink:#DCE6D6; --ink-soft:#97A79C;
  --brass:#C9A46A; --brass-dark:#8C6E3E; --glass:#2E3D36; --glass-edge:#5D6D63;
  --socket:#56645B; --track:#3A4A42; --btn-ink:#1D2924;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;
  background:var(--panel);color:var(--ink);
  font:400 1rem/1.5 "Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:grid;place-items:center;
}
main{width:100%;max-width:34rem;padding:2rem 1.25rem 2.5rem}

.face{
  display:grid;grid-template-columns:auto 1fr;align-items:center;gap:1.5rem;
}
.lamp{width:clamp(9rem,40vw,12.5rem);height:auto;display:block;overflow:visible}
.tempo{min-width:0}
.bpm{
  font-family:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;
  font-weight:800;font-size:clamp(5rem,22vw,8.5rem);line-height:.82;
  letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin:0;
}
.unit{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:500;font-size:1.5rem;color:var(--ink-soft);margin:.35rem 0 0}
.marking{font-style:italic;color:var(--ink-soft);margin:.15rem 0 0;font-size:1.05rem}

.pilots{display:flex;gap:.6rem;margin-top:1.75rem;justify-content:center;flex-wrap:wrap}
.pilot{width:1.1rem;height:1.1rem;border-radius:50%;background:var(--track);
  box-shadow:inset 0 0 0 2px var(--panel-2);transition:none}

.controls{margin-top:2rem;display:grid;gap:1.4rem}
.row{display:grid;gap:.5rem}
.row > label, .row > .label{font-weight:500;font-size:.95rem}
.slider-line{display:grid;grid-template-columns:auto 1fr auto;gap:.75rem;align-items:center}
.nudge{
  font:600 1.25rem/1 "Work Sans",system-ui,sans-serif;
  width:2.5rem;height:2.5rem;border-radius:50%;border:2px solid var(--ink-soft);
  background:transparent;color:var(--ink);cursor:pointer;
}
.nudge:hover{border-color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--brass);height:2rem}

.meter{display:flex;gap:.4rem;flex-wrap:wrap}
.meter button{
  font:600 1rem/1 "Work Sans",system-ui,sans-serif;
  min-width:2.6rem;height:2.6rem;padding:0 .7rem;border-radius:.4rem;
  border:2px solid var(--track);background:var(--panel-2);color:var(--ink);cursor:pointer;
}
.meter button[aria-pressed="true"]{border-color:var(--brass);background:var(--brass);color:var(--btn-ink)}

.start{
  margin-top:.5rem;width:100%;height:3.5rem;border:0;border-radius:1.75rem;
  background:var(--ink);color:var(--panel);cursor:pointer;
  font:800 1.6rem/1 "Big Shoulders Display",Impact,sans-serif;letter-spacing:.02em;
}
.start[aria-pressed="true"]{background:var(--red);color:#fff}
.hint{text-align:center;color:var(--ink-soft);font-size:.875rem;margin:.6rem 0 0}

button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:3px}

.timing{
  margin:2.25rem 0 0;padding-top:1rem;border-top:1px solid var(--track);
  display:grid;grid-template-columns:repeat(auto-fit,minmax(7.5rem,1fr));gap:.75rem 1rem;
  font-size:.85rem;
}
.timing div{min-width:0}
.timing dt{color:var(--ink-soft)}
.timing dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}

@media (max-width:420px){
  .face{grid-template-columns:1fr;justify-items:center;text-align:center;gap:1rem}
}
</style>
</head>
<body>
<main>
  <section class="face" aria-label="Metronome">
    <svg class="lamp" viewBox="0 0 200 256" role="img" aria-label="Metronome pendulum">
      <!-- case -->
      <path d="M78,22 L122,22 L182,242 L18,242 Z" fill="var(--brass)" stroke="var(--brass-dark)" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M87,36 L113,36 L158,222 L42,222 Z" fill="var(--glass)" stroke="var(--brass-dark)" stroke-width="1.5" stroke-linejoin="round"/>
      <rect x="14" y="240" width="172" height="12" rx="3" fill="var(--brass-dark)"/>

      <!-- tempo scale behind the rod -->
      <path d="M92,60h16M96,72h8M92,84h16M96,96h8M92,108h16M96,120h8M92,132h16M96,144h8M92,156h16M96,168h8"
            stroke="var(--ink-soft)" stroke-width="1.5" opacity=".7"/>

      <!-- pendulum: rotates about the pivot at (100, 205) -->
      <g id="rod" transform="rotate(0 100 205)">
        <line x1="100" y1="214" x2="100" y2="26" stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round"/>
        <g id="bob" transform="translate(0 100)">
          <path d="M87,-11 L113,-11 L118,11 L82,11 Z" fill="var(--ink)" stroke-linejoin="round"/>
          <path id="bobLit" d="M87,-11 L113,-11 L118,11 L82,11 Z" fill="#FFB23F" opacity="0"/>
          <circle cx="100" cy="0" r="2.6" fill="var(--brass)"/>
        </g>
      </g>
      <circle cx="100" cy="205" r="6.5" fill="var(--brass-dark)" stroke="var(--ink)" stroke-width="2"/>
    </svg>

    <div class="tempo">
      <p class="bpm" id="bpm" aria-live="polite">120</p>
      <p class="unit">beats per minute</p>
      <p class="marking" id="marking">Allegro</p>
    </div>
  </section>

  <div class="pilots" id="pilots" aria-hidden="true"></div>

  <div class="controls">
    <div class="row">
      <label for="tempo">Tempo</label>
      <div class="slider-line">
        <button class="nudge" id="slower" aria-label="Slower by 1">−</button>
        <input type="range" id="tempo" min="30" max="260" step="1" value="120">
        <button class="nudge" id="faster" aria-label="Faster by 1">+</button>
      </div>
    </div>

    <div class="row">
      <span class="label" id="meterLabel">Beats per bar</span>
      <div class="meter" id="meter" role="group" aria-labelledby="meterLabel"></div>
    </div>

    <div class="row">
      <label for="volume">Volume</label>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8">
    </div>

    <div>
      <button class="start" id="start" aria-pressed="false">Start</button>
      <p class="hint">Space starts and stops. Arrow keys change tempo, Shift for steps of 5.</p>
    </div>
  </div>

  <dl class="timing" aria-label="Scheduler timing">
    <div><dt>Wake-up tick</dt><dd id="tTick">25 ms</dd></div>
    <div><dt>Schedule ahead</dt><dd id="tAhead">100 ms</dd></div>
    <div><dt>Tick runs in</dt><dd id="tKind">–</dd></div>
    <div><dt>Output latency</dt><dd id="tLat">–</dd></div>
  </dl>
</main>

<script>
(() => {
  "use strict";

  /* ---------- Scheduler constants ---------- */
  const TICK_MS = 25;          // how often the timer wakes the scheduler (it never plays sound itself)
  const SCHEDULE_AHEAD = 0.1;  // seconds of audio scheduled past AudioContext.currentTime on each wake
  // The window is 4x the tick interval, so a late or throttled tick (up to ~75 ms) still finds
  // notes already queued on the audio clock. No note's timing depends on when the tick arrives.

  /* ---------- State ---------- */
  let ctx = null, master = null, clickAccent = null, clickBeat = null;
  let tempo = 120, beatsPerBar = 4, volume = 0.8;
  let running = false;
  let nextNoteTime = 0;   // AudioContext time of the next note to schedule
  let beatIndex = 0;      // position in bar of the next note
  const visualQueue = []; // {beat, time} handed from the scheduler to the draw loop
  const liveSources = new Set();
  let shown = null;       // last note the pendulum has reached
  let rafId = 0;
  let beatCount = 0;      // running count, so the rod alternates sides
  let startT = 0, stopAt = 0, restAngle = 0, curAngle = 0;
  const SWING = 24;       // degrees either side of centre

  /* ---------- DOM ---------- */
  const $ = id => document.getElementById(id);
  const bpmEl = $("bpm"), markingEl = $("marking"), tempoEl = $("tempo"),
        startBtn = $("start"), meterEl = $("meter"), pilotsEl = $("pilots"),
        rod = $("rod"), bob = $("bob"), bobLit = $("bobLit");
  $("tTick").textContent = TICK_MS + " ms";
  $("tAhead").textContent = SCHEDULE_AHEAD * 1000 + " ms";

  /* ---------- Click samples (synthesized once into AudioBuffers) ---------- */
  function makeClick(freq) {
    const sr = ctx.sampleRate, len = Math.ceil(sr * 0.04);
    const buf = ctx.createBuffer(1, len, sr), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) {
      const t = i / sr;
      const env = Math.exp(-t * 150) * (1 - Math.exp(-t * 5000)); // fast attack, quick decay
      d[i] = env * (0.75 * Math.sin(2 * Math.PI * freq * t) + 0.25 * Math.sin(2 * Math.PI * freq * 2.76 * t));
    }
    return buf;
  }

  function initAudio() {
    ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: "interactive" });
    master = ctx.createGain();
    master.gain.value = volume;
    master.connect(ctx.destination);
    clickAccent = makeClick(1760);
    clickBeat = makeClick(1100);
  }

  /* ---------- Wake-up ticker: Web Worker, main-thread fallback ---------- */
  function makeTicker(onTick) {
    let impl = null;
    const mainThread = () => {
      let id = null;
      return { kind: "main thread",
        start: ms => { clearInterval(id); id = setInterval(onTick, ms); },
        stop: () => { clearInterval(id); id = null; } };
    };
    try {
      const src = "let id=null;onmessage=e=>{const m=e.data;" +
        "if(m.cmd==='start'){clearInterval(id);id=setInterval(()=>postMessage(0),m.ms);}" +
        "else{clearInterval(id);id=null;}};";
      const url = URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
      const w = new Worker(url);
      w.onmessage = onTick;
      let lastMs = TICK_MS, wanted = false;
      w.onerror = e => {               // e.g. worker blocked by the page's security policy
        e.preventDefault?.();
        impl = mainThread();
        if (wanted) impl.start(lastMs);
        $("tKind").textContent = impl.kind;
      };
      impl = { kind: "Web Worker",
        start: ms => { wanted = true; lastMs = ms; w.postMessage({ cmd: "start", ms }); },
        stop: () => { wanted = false; w.postMessage({ cmd: "stop" }); } };
    } catch (_) {
      impl = mainThread();
    }
    return { get kind() { return impl.kind; },
             start: ms => impl.start(ms), stop: () => impl.stop() };
  }

  /* ---------- Scheduler ---------- */
  function scheduler() {
    if (!running) return;
    const now = ctx.currentTime;
    const spb = 60 / tempo;

    // If the page was suspended, skip beats we can no longer play on time rather than burst them.
    if (nextNoteTime < now - 0.05) {
      const missed = Math.ceil((now - nextNoteTime) / spb);
      nextNoteTime += missed * spb;
      beatIndex = (beatIndex + missed) % beatsPerBar;
    }

    while (nextNoteTime < now + SCHEDULE_AHEAD) {
      scheduleNote(beatIndex, nextNoteTime);
      nextNoteTime += 60 / tempo;              // read tempo per note so changes apply at the next beat
      beatIndex = (beatIndex + 1) % beatsPerBar;
    }
  }

  function scheduleNote(beat, time) {
    const src = ctx.createBufferSource();
    src.buffer = beat === 0 ? clickAccent : clickBeat;
    src.connect(master);
    src.start(time);
    liveSources.add(src);
    src.onended = () => liveSources.delete(src);
    visualQueue.push({ beat, time, n: beatCount++ }); // the pendulum reads this against the same clock
  }

  const ticker = makeTicker(scheduler);

  /* ---------- Visual sync ---------- */
  // The context time that is reaching the speakers right now. currentTime is when audio
  // is rendered, so the lamp would flash early by the output latency without this.
  function heardTime() {
    if (ctx.getOutputTimestamp) {
      const ts = ctx.getOutputTimestamp();
      if (ts.contextTime > 0 && ts.performanceTime > 0) {
        const t = ts.contextTime + (performance.now() - ts.performanceTime) / 1000;
        return Math.min(t, ctx.currentTime);
      }
    }
    return ctx.currentTime - (ctx.outputLatency || ctx.baseLatency || 0);
  }

  function draw() {
    let angle = 0, glow = 0;
    if (running) {
      const now = heardTime();
      while (visualQueue.length && visualQueue[0].time <= now) shown = visualQueue.shift();
      if (shown) {
        // Each click is an extreme of the swing; between two clicks the rod crosses to the
        // other side. Phase comes from the scheduled times, so motion and sound share one clock.
        const next = visualQueue[0];
        const period = next ? next.time - shown.time : 60 / tempo;
        const p = Math.min(1, Math.max(0, (now - shown.time) / period));
        const side = shown.n % 2 === 0 ? 1 : -1;
        angle = SWING * side * Math.cos(Math.PI * p);
        glow = Math.exp(-(now - shown.time) / Math.min(0.09, (60 / tempo) * 0.3));
      } else {
        // Lead-in: swing out from centre so the first click lands at the right-hand extreme.
        const first = visualQueue[0];
        const p = first ? Math.min(1, Math.max(0, (now - startT) / (first.time - startT))) : 0;
        angle = SWING * Math.sin(Math.PI / 2 * p);
      }
    } else {
      const k = Math.min(1, (performance.now() - stopAt) / 450);
      angle = restAngle * (1 - k) * (1 - k);   // ease back to centre after stopping
    }
    curAngle = angle;
    paint(angle, glow, shown);

    if (running || Math.abs(angle) > 0.01) rafId = requestAnimationFrame(draw);
    else { paint(0, 0, null); rafId = 0; }
  }

  function paint(angle, glow, note) {
    rod.setAttribute("transform", `rotate(${angle.toFixed(2)} 100 205)`);
    const accent = note && note.beat === 0;
    bobLit.setAttribute("fill", accent ? "#E5483B" : "#FFB23F");
    bobLit.setAttribute("opacity", glow * 0.9);
    const dots = pilotsEl.children;
    for (let i = 0; i < dots.length; i++) {
      const on = note && note.beat === i && glow > 0.02;
      dots[i].style.background = on ? (i === 0 ? "var(--red)" : "var(--amber)") : "";
      dots[i].style.opacity = on ? 0.45 + 0.55 * glow : "";
    }
  }

  /* ---------- Transport ---------- */
  async function start() {
    if (!ctx) initAudio();
    if (ctx.state !== "running") await ctx.resume();
    beatIndex = 0;
    startT = ctx.currentTime;
    nextNoteTime = startT + Math.max(0.06, Math.min(0.5, 15 / tempo)); // quarter-beat lead-in for the swing
    beatCount = 0;
    visualQueue.length = 0;
    shown = null;
    running = true;
    scheduler();                       // fill the first window immediately
    ticker.start(TICK_MS);
    $("tKind").textContent = ticker.kind;
    const lat = (ctx.outputLatency || ctx.baseLatency || 0) * 1000;
    $("tLat").textContent = lat ? lat.toFixed(1) + " ms" : "not reported";
    startBtn.textContent = "Stop";
    startBtn.setAttribute("aria-pressed", "true");
    if (!rafId) rafId = requestAnimationFrame(draw);
  }

  function stop() {
    running = false;
    ticker.stop();
    restAngle = curAngle;
    stopAt = performance.now();
    if (!rafId) rafId = requestAnimationFrame(draw);
    const now = ctx.currentTime;
    for (const s of liveSources) { try { s.stop(now); } catch (_) {} }  // cancel clicks queued ahead
    liveSources.clear();
    visualQueue.length = 0;
    startBtn.textContent = "Start";
    startBtn.setAttribute("aria-pressed", "false");
  }

  startBtn.addEventListener("click", () => running ? stop() : start());

  /* ---------- Controls ---------- */
  const markings = [[40,"Grave"],[60,"Largo"],[66,"Larghetto"],[76,"Adagio"],[108,"Andante"],
    [120,"Moderato"],[156,"Allegro"],[176,"Vivace"],[200,"Presto"],[Infinity,"Prestissimo"]];

  function setTempo(v) {
    tempo = Math.max(30, Math.min(260, Math.round(v)));
    tempoEl.value = tempo;
    bpmEl.textContent = tempo;
    markingEl.textContent = markings.find(([max]) => tempo < max)[1];
    // Like a real metronome: weight high on the rod for slow tempi, low for fast.
    bob.setAttribute("transform", `translate(0 ${(58 + (tempo - 30) / 230 * 112).toFixed(1)})`);
  }
  tempoEl.addEventListener("input", e => setTempo(+e.target.value));
  $("slower").addEventListener("click", () => setTempo(tempo - 1));
  $("faster").addEventListener("click", () => setTempo(tempo + 1));

  $("volume").addEventListener("input", e => {
    volume = +e.target.value;
    if (master) master.gain.setTargetAtTime(volume, ctx.currentTime, 0.01);
  });

  function setMeter(n) {
    beatsPerBar = n;
    beatIndex %= n;
    for (const b of meterEl.children) b.setAttribute("aria-pressed", String(+b.dataset.n === n));
    pilotsEl.replaceChildren(...Array.from({ length: n }, () => {
      const d = document.createElement("span"); d.className = "pilot"; return d;
    }));
  }
  for (let n = 1; n <= 7; n++) {
    const b = document.createElement("button");
    b.textContent = n; b.dataset.n = n;
    b.setAttribute("aria-label", n + (n === 1 ? " beat" : " beats") + " per bar");
    b.addEventListener("click", () => setMeter(n));
    meterEl.append(b);
  }
  setMeter(4);
  setTempo(120);

  document.addEventListener("keydown", e => {
    const t = e.target;
    const inControl = t && (t.tagName === "INPUT" || t.tagName === "BUTTON");
    if (e.code === "Space" && !inControl) { e.preventDefault(); running ? stop() : start(); }
    if (!inControl && (e.key === "ArrowUp" || e.key === "ArrowRight")) { e.preventDefault(); setTempo(tempo + (e.shiftKey ? 5 : 1)); }
    if (!inControl && (e.key === "ArrowDown" || e.key === "ArrowLeft")) { e.preventDefault(); setTempo(tempo - (e.shiftKey ? 5 : 1)); }
  });
})();
</script>
</body>
</html>
